# Created using @tscircuit/plop (npm install -g @tscircuit/plop)
name: Bun Test

on:
  pull_request:
  push:
    branches:
      - main

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Resolve the released phase-skew packages
        run: |
          CI=false bun install --lockfile-only --ignore-scripts
          grep -E '^    "(@tscircuit/circuit-json-util|@tscircuit/circuit-json-webgpu|circuit-to-canvas)":' bun.lock

      - name: Install dependencies
        run: bun install

      - name: Install Chromium for browser regressions
        run: bunx --no-install playwright install --with-deps chromium

      - name: Run tests
        run: bun test
